name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - '**.png'
      - '**.svg'
      - '**.jpg'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - '**.png'
      - '**.svg'
      - '**.jpg'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + type check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run frontend:build

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit

  rust:
    name: Rust (fmt + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          timeout 5m sudo apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          for attempt in 1 2; do
            if timeout 5m sudo apt-get install -y \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libx11-dev \
              libxtst-dev \
              libxinerama-dev \
              libssl-dev \
              pkg-config \
              build-essential; then
              exit 0
            fi
            echo "apt-get install failed (attempt $attempt/2); retrying..."
            timeout 5m sudo apt-get update -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30
            sleep 10
          done
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked

      - name: Dependency audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
